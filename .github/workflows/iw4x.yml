name: IW4x

# Build the reporter that ships with IW4x (see crash-reporter/ in
# iw4x-rawfiles): the Windows build, and the Linux build that IW4x starts
# instead when running under Wine.
#
# Pushing a tag also publishes the builds as a release, which is where the
# files in iw4x-rawfiles come from. Builds aren't reproducible, so the release
# is what pins the exact files that IW4x ships. The tag is r followed by the
# number of commits, as with IW4x itself (say, r301).
#
# This is separate from ci.yml, which only runs on upstream's branches, so
# that merging upstream doesn't conflict with it.

on:
  push:
    branches:
      - iw4x
    tags:
      - 'r[0-9]*'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - iw4x
  workflow_dispatch:

permissions:
  contents: read

env:
  STEP_TIMEOUT_MINUTES: 60

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
       include:
         - os: windows-2025
           rid: win-x64
           binary: Sentry.CrashReporter.exe
         - os: ubuntu-24.04
           rid: linux-x64
           binary: Sentry.CrashReporter

    name: Build (${{ matrix.rid }})

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install Dependencies
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        uses: "./.github/steps/install_dependencies"
        with:
          target-platform: "desktop"

      - name: Build Sentry.CrashReporter (Release)
        shell: pwsh
        run: dotnet publish -f net10.0-desktop -r ${{ matrix.rid }} ./Sentry.CrashReporter/Sentry.CrashReporter.csproj -o ./build

      # The build is a single file, which is what goes into iw4x-rawfiles.
      # Note that the artifact doesn't keep the file mode, so the Linux
      # build has to be made executable again once downloaded.
      #
      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crash-reporter-${{ matrix.rid }}
          path: ./build/${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Release
    needs: [build, unit_test]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Check Tag
        shell: bash
        run: |
          expected="r$(git rev-list --count "$GITHUB_SHA")"

          if [[ "$TAG" != "$expected" ]]; then
            echo "::error::tag $TAG should be $expected, the number of commits"
            exit 1
          fi

      - name: Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: crash-reporter-*
          path: ./artifacts
          merge-multiple: true

      - name: Create Release
        shell: bash
        working-directory: artifacts
        run: |
          sha256sum Sentry.CrashReporter.exe Sentry.CrashReporter > SHA256SUMS

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes "" \
            Sentry.CrashReporter.exe Sentry.CrashReporter SHA256SUMS

  unit_test:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install Dependencies
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        uses: "./.github/steps/install_dependencies"
        with:
          target-platform: "desktop"

      - name: Build Sentry.CrashReporter.Tests (Release)
        shell: pwsh
        run: dotnet build ./tests/Sentry.CrashReporter.Tests/Sentry.CrashReporter.Tests.csproj /p:Configuration=Release /p:OverrideTargetFramework=net10.0

      - name: Run Unit Tests
        shell: pwsh
        run: dotnet test ./tests/Sentry.CrashReporter.Tests/Sentry.CrashReporter.Tests.csproj --no-build -c Release --logger GitHubActions
